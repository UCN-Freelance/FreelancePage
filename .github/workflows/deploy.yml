name: Deploy UCN Freelance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            cd /home/next/Docker/FreelancePage

            echo "Ensuring pm2 is available..."
            export PATH="$HOME/.npm-global/bin:$PATH"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm config set prefix "$HOME/.npm-global"
              npm install -g pm2@latest
            fi

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating main..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Nuxt..."
            npm run build

            echo "Restarting website..."
            pm2 delete ucn-freelance || true
            HOST=0.0.0.0 PORT=3000 pm2 start .output/server/index.mjs --name ucn-freelance

            pm2 save

            echo "Deployment complete."