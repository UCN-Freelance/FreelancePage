name: Deploy UCN Freelance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            cd /home/next/Docker/FreelancePage

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating main..."
            git reset --hard origin/main

            # No `npm ci` here on purpose. The nuxt service runs its own
            # `npm ci && npm run build` against this same bind-mounted
            # directory, as root, so node_modules on the host ends up
            # owned by root:root. A host-level npm ci then runs as the
            # deploy user and dies with EACCES trying to unlink those
            # files. It was duplicated work even when it did succeed.
            echo "Building and restarting website..."
            docker compose down
            docker compose up -d

            # `up -d` returns as soon as the container starts, long before
            # `npm ci && npm run build` finishes inside it. Without this
            # wait a failed build leaves the workflow green and the site
            # down, since `down` has already stopped the old container.
            echo "Waiting for the build to finish and the app to start..."
            for i in $(seq 1 120); do
              if docker compose logs nuxt 2>&1 | grep -q "Listening on"; then
                echo "Deployment complete."
                exit 0
              fi
              sleep 5
            done

            echo "App did not start within 10 minutes. Recent logs:"
            docker compose logs --tail=100 nuxt
            exit 1