services:
  nuxt:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /home/next/Docker/FreelancePage:/app
    command: sh -c "npm ci && npm run build && node .output/server/index.mjs"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
    expose:
      - "3000"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/next/Docker/min-hjemmeside/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nuxt

volumes:
  caddy_data:
  caddy_config: